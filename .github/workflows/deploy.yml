# Builds the site and deploys it to Cloudflare Pages (project mastery-b2b-sales)
# on every push to main. Can also be run by hand from the Actions tab.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Swissra is not public in this repo: it is committed encrypted and
      # unpacked into public/fonts/ only for the build.
      - name: Unpack Swissra fonts
        env:
          PASS: ${{ secrets.SWISSRA_FONTS_PASSPHRASE }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:PASS \
            -in ci/swissra-fonts.tgz.enc | tar -xzf - -C public/fonts
          ls -l public/fonts/swissra-*

      - run: npm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx wrangler pages deploy dist
          --project-name mastery-b2b-sales
          --branch main
          --commit-hash "$GITHUB_SHA"
          --commit-message "$(git log -1 --pretty=%s)"
